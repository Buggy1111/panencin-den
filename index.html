<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panenčin den</title>
<meta name="description" content="Panenčin den — oblékání, pláž, koupel a spaní. Hra pro děti, bez reklam, funguje i offline.">
<meta name="theme-color" content="#ff7f66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <button class="sound-btn" id="soundBtn" aria-label="Zapnout/vypnout zvuk">🔊</button>

    <!-- ============ HOME ============ -->
    <section class="scene active" data-scene="home">
      <h1><span class="heart">♥</span> Panenčin den <span class="heart">♥</span></h1>
      <div class="scene-bg home-sky">
        <div class="home-sparkle s1"></div>
        <div class="home-sparkle s2"></div>
        <div class="home-sparkle s3"></div>
        <div class="home-sun"></div>
        <div class="home-moon"></div>
        <div class="home-cloud c1"></div>
        <div class="home-cloud c2"></div>
      </div>
      <div class="doll-spot" id="dollSpotHome" style="bottom:62%"></div>
      <div class="scene-content">
        <div class="doll-name">Ahoj, Andulko! <span>Co budeme dělat?</span></div>
        <div class="bow-picker" id="bowPicker" role="group" aria-label="Barva mašličky">
          <button class="bow-swatch" data-bow="pink" style="--sw-a:#ff6fa5;--sw-b:#ff87b3" aria-label="Růžová"></button>
          <button class="bow-swatch" data-bow="blue" style="--sw-a:#5b8def;--sw-b:#7ea3f2" aria-label="Modrá"></button>
          <button class="bow-swatch" data-bow="purple" style="--sw-a:#a978d6;--sw-b:#c39fe8" aria-label="Fialová"></button>
          <button class="bow-swatch" data-bow="gold" style="--sw-a:#f5b942;--sw-b:#f7cc73" aria-label="Zlatá"></button>
        </div>
        <div class="badge-strip" id="badgeStrip">
          <div class="badge" data-badge="outside" title="Oblečená přesně na počasí">🌤️</div>
          <div class="badge" data-badge="beach" title="Den na pláži zvládnutý">🏖️</div>
          <div class="badge" data-badge="bath" title="Umytá, čisté zoubky i vlásky">🛁</div>
          <div class="badge" data-badge="breakfast" title="Snídaně snědená">🥣</div>
          <div class="badge" data-badge="lunch" title="Oběd snědený">🍝</div>
          <div class="badge" data-badge="dinner" title="Večeře snědená">🍽️</div>
          <div class="badge" data-badge="bedtime" title="Uspávací rituál hotový">🌙</div>
        </div>
        <div class="room-grid">
          <button class="room-btn outside" data-goto="outside">
            <span class="badge"><span class="emo">🌤️</span></span><span class="label">Ven<span class="sub">Podle počasí</span></span>
          </button>
          <button class="room-btn breakfast" data-goto="meal" data-meal="breakfast">
            <span class="badge"><span class="emo">🥣</span></span><span class="label">Snídaně<span class="sub">Dobré ráno</span></span>
          </button>
          <button class="room-btn beach" data-goto="beach">
            <span class="badge"><span class="emo">🏖️</span></span><span class="label">Pláž<span class="sub">Krém a deka</span></span>
          </button>
          <button class="room-btn lunch" data-goto="meal" data-meal="lunch">
            <span class="badge"><span class="emo">🍝</span></span><span class="label">Oběd<span class="sub">Dobrou chuť</span></span>
          </button>
          <button class="room-btn bath" data-goto="bath">
            <span class="badge"><span class="emo">🛁</span></span><span class="label">Koupel<span class="sub">Bublinky</span></span>
          </button>
          <button class="room-btn dinner" data-goto="meal" data-meal="dinner">
            <span class="badge"><span class="emo">🍽️</span></span><span class="label">Večeře<span class="sub">Dobrou chuť</span></span>
          </button>
          <button class="room-btn night wide" data-goto="bedtime">
            <span class="badge"><span class="emo">🌙</span></span><span class="label">Spinkat<span class="sub">Pyžamko a budík</span></span>
          </button>
        </div>
        <footer>Hra pro Andulku 🎀</footer>
      </div>
    </section>

    <!-- ============ OUTSIDE ============ -->
    <section class="scene" data-scene="outside">
      <button class="back-btn" data-goto="home">←</button>
      <div class="eyebrow">Ven s kamarádkou</div>
      <div class="scene-bg sky-bg w-sun" id="outsideSky">
        <div class="ground"></div>
        <div class="weather-fx" id="weatherFx"></div>
      </div>
      <div class="doll-spot" id="dollSpotOutside"></div>
      <div class="side-rail left" id="weatherRail">
        <button class="pick-btn" data-weather="sun">☀️<span class="tag">Sluníčko</span></button>
        <button class="pick-btn" data-weather="rain">🌧️<span class="tag">Prší</span></button>
        <button class="pick-btn" data-weather="cold">❄️<span class="tag">Zima</span></button>
        <button class="pick-btn" data-weather="cloud">⛅<span class="tag">Oblačno</span></button>
      </div>
      <div class="side-rail right" id="outsideOutfits">
        <button class="pick-btn" data-outfit="sundress">👗<span class="tag">Šatičky</span></button>
        <button class="pick-btn" data-outfit="raincoat">🧥<span class="tag">Pláštěnka</span></button>
        <button class="pick-btn" data-outfit="coat">🧣<span class="tag">Kabátek</span></button>
        <button class="pick-btn" data-outfit="cardigan">🦺<span class="tag">Svetřík</span></button>
        <button class="pick-btn" data-outfit="blue">💙<span class="tag">Modré šaty</span></button>
        <button class="pick-btn" data-outfit="pink">🎀<span class="tag">Růžové šaty</span></button>
        <button class="pick-btn" data-outfit="denim">👖<span class="tag">Rifle</span></button>
        <button class="pick-btn" data-outfit="princess">👑<span class="tag">Princezna</span></button>
        <button class="pick-btn" data-outfit="snowsuit">☃️<span class="tag">Kombinéza</span></button>
        <button class="pick-btn" data-outfit="poncho">☔<span class="tag">Plášť s puntíky</span></button>
        <button class="pick-btn" data-outfit="windbreaker">🍂<span class="tag">Bunda</span></button>
        <button class="pick-btn" data-outfit="green">🍏<span class="tag">Zelené šatičky</span></button>
        <button class="pick-btn" data-outfit="yellow">🌻<span class="tag">Žluté tílko</span></button>
        <button class="pick-btn" data-outfit="grayhoodie">🧢<span class="tag">Šedá mikina</span></button>
        <button class="pick-btn" data-outfit="vest">🌿<span class="tag">Zelená vesta</span></button>
        <button class="pick-btn" data-outfit="stripedtee">⚓<span class="tag">Pruhované triko</span></button>
        <button class="pick-btn" data-outfit="blueraincoat">💧<span class="tag">Modrá pláštěnka</span></button>
        <button class="pick-btn" data-outfit="greenstriped">🐸<span class="tag">Zelená pláštěnka</span></button>
        <button class="pick-btn" data-outfit="pinkponcho">🌸<span class="tag">Růžové pončo</span></button>
        <button class="pick-btn" data-outfit="yellowoveralls">🐝<span class="tag">Žlutý overal</span></button>
        <button class="pick-btn" data-outfit="purplesnowsuit">🔮<span class="tag">Fialová kombinéza</span></button>
        <button class="pick-btn" data-outfit="redcoat">❤️<span class="tag">Červený kabát</span></button>
        <button class="pick-btn" data-outfit="graysweaterscarf">🐑<span class="tag">Svetr se šálou</span></button>
        <button class="pick-btn" data-outfit="greenparka">🌲<span class="tag">Zelená parka</span></button>
      </div>
      <div class="scene-content top-caption">
        <div class="temp-badge" id="tempBadge" style="display:none"></div>
        <div class="feedback" id="outsideFeedback"></div>
      </div>
    </section>

    <!-- ============ BEACH ============ -->
    <section class="scene" data-scene="beach">
      <button class="back-btn" data-goto="home">←</button>
      <div class="eyebrow">Den na pláži</div>
      <div class="scene-bg beach-bg">
        <div class="sea"><div class="wave"></div></div>
        <div class="umbrella">⛱️</div>
      </div>
      <div class="towel-mat" id="towelMat"></div>
      <div class="shine-ring" id="shineRing"></div>
      <div class="doll-spot" id="dollSpotBeach"></div>
      <div class="side-rail right">
        <div class="progress-wrap" id="sunscreenWrap">
          <button class="bottle-btn" id="sunscreenBtn">🧴 Krém na sluníčko</button>
          <div class="progress-track"><div class="progress-fill" id="sunscreenFill"></div></div>
        </div>
        <button class="primary-btn" id="towelBtn">Položit na deku</button>
      </div>
      <div class="scene-content top-caption">
        <div class="feedback" id="beachFeedback"></div>
      </div>
    </section>

    <!-- ============ BATH ============ -->
    <section class="scene" data-scene="bath">
      <button class="back-btn" data-goto="home">←</button>
      <div class="eyebrow">Koupel</div>
      <div class="scene-bg bath-bg"></div>
      <div class="sink" id="sink">
        <div class="sink-faucet"></div>
        <div class="sink-basin"></div>
      </div>
      <div class="tub">
        <div class="tub-water" id="tubWater"></div>
        <div class="duck" id="duck">🦆</div>
        <div id="bubbleField"></div>
      </div>
      <div class="doll-spot" id="dollSpotBath" style="bottom:30%;"></div>
      <div class="side-rail right">
        <button class="primary-btn" id="fillBtn">Napustit vodu 🚿</button>
        <button class="primary-btn" id="bubbleBtn" disabled>Přidat bublinky 🫧</button>
        <button class="primary-btn" id="drainBtn" disabled>Utřít a obléct ✨</button>
        <button class="primary-btn" id="toothBtn" disabled>Vyčistit zoubky 🪥</button>
        <button class="primary-btn" id="hairBtn" disabled>Učesat vlásky 💇</button>
      </div>
      <div class="scene-content top-caption">
        <div class="feedback" id="bathFeedback"></div>
      </div>
    </section>

    <!-- ============ MEAL (snídaně/oběd/večeře — jedna scéna, tři kontexty) ============ -->
    <section class="scene" data-scene="meal">
      <button class="back-btn" data-goto="home">←</button>
      <div class="eyebrow" id="mealEyebrow">Jídlo</div>
      <div class="scene-bg meal-bg" id="mealBg"></div>
      <div class="table">
        <div class="plate">
          <div class="plate-food" id="plateFood"></div>
        </div>
      </div>
      <div class="doll-spot" id="dollSpotMeal" style="bottom:28%;"></div>
      <div class="side-rail left" id="mealFoodRail">
        <button class="pick-btn" data-meal="breakfast" data-food="porridge">🥣<span class="tag">Kaše s ovocem</span></button>
        <button class="pick-btn" data-meal="breakfast" data-food="toast">🍞<span class="tag">Toast s medem</span></button>
        <button class="pick-btn" data-meal="breakfast" data-food="cereal">🥛<span class="tag">Mléko s cereáliemi</span></button>
        <button class="pick-btn" data-meal="breakfast" data-food="egg">🍳<span class="tag">Vajíčko</span></button>
        <button class="pick-btn" data-meal="lunch" data-food="soup">🍲<span class="tag">Polévka</span></button>
        <button class="pick-btn" data-meal="lunch" data-food="pasta">🍝<span class="tag">Těstoviny se zeleninou</span></button>
        <button class="pick-btn" data-meal="lunch" data-food="salad">🥗<span class="tag">Salát</span></button>
        <button class="pick-btn" data-meal="lunch" data-food="chicken">🍗<span class="tag">Kuřecí s rýží</span></button>
        <button class="pick-btn" data-meal="dinner" data-food="dumplings">🍛<span class="tag">Knedlíky s omáčkou</span></button>
        <button class="pick-btn" data-meal="dinner" data-food="sandwich">🥪<span class="tag">Chleba se sýrem</span></button>
        <button class="pick-btn" data-meal="dinner" data-food="veggies">🥗<span class="tag">Zeleninový talíř</span></button>
        <button class="pick-btn" data-meal="dinner" data-food="fruit">🍓<span class="tag">Ovoce</span></button>
      </div>
      <div class="side-rail right">
        <button class="primary-btn" id="setTableBtn">Prostřít stůl 🍽️</button>
        <button class="primary-btn" id="eatBtn" disabled>Ochutnat 😋</button>
      </div>
      <div class="scene-content top-caption">
        <div class="feedback" id="mealFeedback"></div>
      </div>
    </section>

    <!-- ============ BEDTIME ============ -->
    <section class="scene" data-scene="bedtime">
      <button class="back-btn" data-goto="home">←</button>
      <div class="eyebrow">Dobrou noc</div>
      <div class="scene-bg bed-bg">
        <div class="moon"></div>
      </div>
      <div class="bed">
        <div class="blanket" id="blanket"></div>
      </div>
      <div class="doll-spot" id="dollSpotBed" style="bottom:22%;"></div>
      <div class="night-veil" id="nightVeil">
        <div class="goodnight-text" id="goodnightText">
          <div>Dobrou noc, sladké sny 💤</div>
          <button class="replay-btn" id="wakeBtn">Vzbudit</button>
        </div>
      </div>
      <div class="side-rail right">
        <button class="primary-btn" id="pajamaBtn">Obléct pyžamko 🌙</button>
        <button class="primary-btn" id="tuckBtn" disabled>Uložit do postýlky</button>
        <button class="primary-btn" id="goodnightBtn" disabled>Dobrou noc</button>
      </div>
      <div class="scene-content top-caption">
        <div class="feedback" id="bedFeedback"></div>
        <div class="clock-card" id="clockCard" style="display:none">
          <span class="clock-face">⏰</span>
          <div class="clock-arrows"><button id="hourUp">▲</button><button id="hourDown">▼</button></div>
          <span class="clock-time" id="clockTime">7:00</span>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- doll template, cloned into whichever room-spot is active -->
<template id="dollTemplate">
  <svg class="doll" viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="skinGrad" cx="38%" cy="32%" r="75%">
        <stop offset="0%" stop-color="#ffcda8"/>
        <stop offset="100%" stop-color="#f0b899"/>
      </radialGradient>
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="20%" y2="100%">
        <stop offset="0%" stop-color="#8a6249"/>
        <stop offset="100%" stop-color="#5f4130"/>
      </linearGradient>
    </defs>
    <!-- kontaktní stín pod nohama — součást panenky, ne scény, takže funguje
         automaticky ve všech místnostech bez duplikace -->

    <g class="doll-legs">

      <circle cx="112" cy="285" r="2" fill="#ffe0c2"/>
    </g>

    <!-- outfits: bottoms drawn first so torso overlay can sit above -->

    <g class="outfit outfit-cardigan" data-outfit="cardigan">

      <path class="silhouette" d="M50 152 L152 152 L172 250 L30 250 Z" fill="#c9a8e8"/>

      <rect class="silhouette" x="58" y="140" width="86" height="24" rx="12" fill="#a978d6"/>
      <circle cx="70" cy="205" r="3.5" fill="#f5d76e"/>
      <circle cx="132" cy="218" r="3.5" fill="#f5d76e"/>
      <circle cx="101" cy="232" r="3.5" fill="#f5d76e"/>
      <circle cx="88" cy="195" r="3.5" fill="#f5d76e"/>
      <circle cx="114" cy="200" r="3.5" fill="#f5d76e"/>
    </g>
    <g class="outfit outfit-pajamas" data-outfit="pajamas">
      <path class="silhouette" d="M58 148 L144 148 L150 288 L52 288 Z" fill="#cdb8ea"/>
      <rect class="silhouette" x="58" y="138" width="86" height="24" rx="12" fill="#b9a0dd"/>
      <circle cx="80" cy="180" r="3" fill="#fff" opacity="0.8"/>
      <circle cx="118" cy="200" r="3" fill="#fff" opacity="0.8"/>
      <circle cx="95" cy="230" r="3" fill="#fff" opacity="0.8"/>
    </g>
    <g class="outfit outfit-robe" data-outfit="robe">
      <path class="silhouette" d="M58 150 L144 150 L150 250 L52 250 Z" fill="#fff3e6"/>
      <rect class="silhouette" x="58" y="140" width="86" height="24" rx="12" fill="#ffe6c9"/>
    </g>
    <g class="outfit outfit-snowsuit" data-outfit="snowsuit">
      <path class="silhouette" d="M50 146 L152 146 L162 252 L40 252 Z" fill="#7b9fc7"/>
      <rect class="silhouette" x="50" y="134" width="102" height="28" rx="14" fill="#5a7ea8"/>
